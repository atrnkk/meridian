apiVersion: 1

# Loads every dashboard JSON under dashboards/ and games/. Grafana folders mirror
# the directories, e.g. games/example/dashboards/*.json lands in games/example/dashboards.
providers:
  - name: meridian
    type: file
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /meridian
      foldersFromFilesStructure: true
